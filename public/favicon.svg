<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7287"/>
      <stop offset="1" stop-color="#2e5c6e"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98b46"/>
      <stop offset="1" stop-color="#a86f2e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <g transform="translate(50 54)">
    <!-- ears -->
    <path d="M-30 -22 L-20 -2 L-38 -4 Z" fill="url(#fur)"/>
    <path d="M30 -22 L20 -2 L38 -4 Z" fill="url(#fur)"/>
    <!-- head -->
    <ellipse cx="0" cy="2" rx="28" ry="26" fill="url(#fur)"/>
    <!-- mask -->
    <path d="M-26 -2 Q-14 -12 0 -8 Q14 -12 26 -2 Q22 12 12 14 Q4 8 0 8 Q-4 8 -12 14 Q-22 12 -26 -2 Z" fill="#3a2b1a"/>
    <!-- snout -->
    <ellipse cx="0" cy="14" rx="12" ry="10" fill="#f3e6d2"/>
    <!-- eyes -->
    <circle cx="-12" cy="0" r="4" fill="#fdf6ee"/>
    <circle cx="12" cy="0" r="4" fill="#fdf6ee"/>
    <circle cx="-12" cy="0" r="2" fill="#1a1208"/>
    <circle cx="12" cy="0" r="2" fill="#1a1208"/>
    <!-- nose -->
    <ellipse cx="0" cy="11" rx="4" ry="3" fill="#1a1208"/>
  </g>
</svg>
